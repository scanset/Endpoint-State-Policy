[package]
name = "common"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Common types and utilities shared across ESP crates"

[features]
default = ["attestation"]

# CUI-free attestations safe for network transport
# Includes: PolicyOutcome, CheckAttestation, EvidenceSummary (hash only)
attestation = []

# Full results with CUI (findings + evidence)
# Includes: PolicyResult, ComplianceFinding, Evidence (actual values)
full-results = []

# Assessor-grade evidence traceability
# Includes: CollectionMethod with command and inputs fields
# Requires full-results as evidence context is needed
assessor-evidence = ["full-results"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Security_Cryptography"] }

[target.'cfg(not(windows))'.dependencies]
openssl = "0.10"
