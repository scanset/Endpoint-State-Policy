[package]
name = "common"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Common types and utilities shared across ESP crates"

# Assessor-package output is the ONLY shipping format as of v2.0.0. Previous
# versions offered attestation / full-results / assessor-evidence as a
# feature matrix; those have all been removed in favor of a single, complete
# envelope type. See CHANGELOG [2.0.0] for rationale.
[features]
default = []

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Security_Cryptography"] }

[target.'cfg(not(windows))'.dependencies]
openssl = "0.10"
